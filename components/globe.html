<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNIS Globe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  #scene {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Layer 1: Concentric Circular Fire Glow (Centered Behind Planet) ── */
  .fire-halo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(85vw, 430px);
    height: min(85vw, 430px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(255, 110, 20, 0.42) 0%,
      rgba(249, 115, 22, 0.32) 28%,
      rgba(220, 65, 10, 0.16) 48%,
      rgba(180, 40, 0, 0.05) 62%,
      transparent 72%
    );
    filter: blur(14px);
    pointer-events: none;
    z-index: 0;
    animation: firePulse 5s ease-in-out infinite;
  }

  /* ── Layer 2: Outer Circular Fire Corona (Hugs the Planet Rim) ── */
  .fire-corona {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 470px);
    height: min(92vw, 470px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      transparent 40%,
      rgba(255, 95, 15, 0.20) 54%,
      rgba(235, 75, 10, 0.10) 66%,
      transparent 76%
    );
    filter: blur(10px);
    pointer-events: none;
    z-index: 1;
    animation: firePulse 5s ease-in-out infinite reverse;
  }

  @keyframes firePulse {
    0%   { opacity: 0.82; transform: translate(-50%, -50%) scale(0.98); }
    50%  { opacity: 1.00; transform: translate(-50%, -50%) scale(1.03); }
    100% { opacity: 0.82; transform: translate(-50%, -50%) scale(0.98); }
  }

  /* ── Globe canvas sits above glow layers ── */
  #globe-mount {
    position: relative;
    z-index: 2;
    cursor: grab;
  }
  #globe-mount:active {
    cursor: grabbing;
  }

  /* ── WebGL fallback ── */
  #no-webgl {
    display: none;
    text-align: center;
    color: #9AA3B2;
    padding: 2rem;
    position: relative;
    z-index: 10;
  }
  #no-webgl.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .fire-halo, .fire-corona { animation: none !important; }
  }
</style>
</head>
<body>
<div id="scene">
  <div class="fire-halo"></div>
  <div class="fire-corona"></div>
  <div id="globe-mount"></div>
  <div id="no-webgl">
    <p style="font-size:3rem;">🌍</p>
    <p style="margin-top:.6rem;color:#9AA3B2;">Interactive globe requires WebGL.</p>
  </div>
</div>

<!-- globe.gl v2.30.0 — pinned for stability -->
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.30.0/dist/globe.gl.min.js"></script>

<script>
(function () {
  "use strict";

  // ── WebGL guard ──────────────────────────────────────────────────────────
  function hasWebGL() {
    try {
      const c = document.createElement("canvas");
      return !!(window.WebGLRenderingContext &&
                (c.getContext("webgl") || c.getContext("experimental-webgl")));
    } catch (_) { return false; }
  }
  if (!hasWebGL()) {
    document.getElementById("no-webgl").classList.add("show");
    return;
  }

  // ── Responsive size ──────────────────────────────────────────────────────
  function viewSize() {
    const W = window.innerWidth, H = window.innerHeight;
    const s = Math.min(W, H, 500);
    return { W, H, s };
  }
  const { W: iW, H: iH } = viewSize();

  // ── Globe textures (NASA Blue Marble matching existing visual) ───────────
  const TEX  = "https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-blue-marble.jpg";
  const BUMP = "https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-topology.png";

  // ── Build globe ──────────────────────────────────────────────────────────
  const mount = document.getElementById("globe-mount");

  const globe = Globe({ animateIn: false })(mount)
    .width(iW)
    .height(iH)
    .backgroundColor("rgba(0,0,0,0)")   // transparent — parent bg shows through
    .globeImageUrl(TEX)
    .bumpImageUrl(BUMP)
    .showAtmosphere(true)
    .atmosphereColor("#FF6A10")          // fire-orange spherical atmospheric glow
    .atmosphereAltitude(0.20);

  // ── Camera: initial position facing India ────────────────────────────────
  globe.pointOfView({ lat: 20, lng: 80, altitude: 2.05 }, 0);

  // ── Controls: continuous, visible auto-rotation ──────────────────────────
  const ctrl = globe.controls();
  ctrl.autoRotate      = true;
  ctrl.autoRotateSpeed = 1.0;           // Steady, clearly perceptible rotation (60s/orbit)
  ctrl.enableDamping   = true;
  ctrl.dampingFactor   = 0.08;
  ctrl.minDistance     = 105;
  ctrl.maxDistance     = 750;
  ctrl.enablePan       = false;         // no panning — globe stays centered

  // Ensure autoRotate stays active after any user mouse/touch interaction
  ctrl.addEventListener("end", () => {
    ctrl.autoRotate = true;
  });
  window.addEventListener("pointerup", () => {
    ctrl.autoRotate = true;
  });
  window.addEventListener("touchend", () => {
    ctrl.autoRotate = true;
  });

  // ── Lighting: cinematic shading ──────────────────────────────────────────
  globe.onGlobeReady(() => {
    try {
      const scene = globe.scene();
      scene.traverse(obj => {
        // Balanced ambient and directional sunlight
        if (obj.isAmbientLight)      obj.intensity = 0.6;
        if (obj.isDirectionalLight)  obj.intensity = 1.5;
      });
    } catch (_) { /* non-critical */ }
  });

  // ── Responsive resize ────────────────────────────────────────────────────
  window.addEventListener("resize", () => {
    const { W, H } = viewSize();
    globe.width(W).height(H);
  });

})();
</script>
</body>
</html>
