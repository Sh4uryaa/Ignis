<svg viewBox="0 0 440 440" width="440" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the Earth with a warm glowing rim">
  <style>
    .ig-glow { animation: breathe 7s ease-in-out infinite; }
    .ig-rim { animation: rim 7s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    @keyframes rim { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ig-glow, .ig-rim { animation: none; } }
  </style>
  <defs>
    <radialGradient id="igOcean" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#1C2431"/>
      <stop offset="55%" stop-color="#10151D"/>
      <stop offset="100%" stop-color="#07090D"/>
    </radialGradient>
    <radialGradient id="igHalo" cx="220" cy="220" r="218" gradientUnits="userSpaceOnUse">
      <stop offset="0.70" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="0.735" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="0.79" stop-color="#EA580C" stop-opacity="0.26"/>
      <stop offset="0.88" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="igInnerRim" cx="220" cy="220" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0.82" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="0.96" stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0.42"/>
    </radialGradient>
    <radialGradient id="igLight" cx="34%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="igNight" cx="78%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="igBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="igClip"><circle cx="220" cy="220" r="160"/></clipPath>
  </defs>

  <!-- outer fire halo (breathing) -->
  <circle class="ig-glow" cx="220" cy="220" r="218" fill="url(#igHalo)"/>

  <!-- globe body -->
  <circle cx="220" cy="220" r="160" fill="url(#igOcean)"/>

  <g clip-path="url(#igClip)">
    <!-- graticule -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="0.8">
      <ellipse cx="220" cy="220" rx="40" ry="160"/>
      <ellipse cx="220" cy="220" rx="85" ry="160"/>
      <ellipse cx="220" cy="220" rx="125" ry="160"/>
      <line x1="220" y1="60" x2="220" y2="380"/>
      <ellipse cx="220" cy="220" rx="160" ry="30"/>
      <ellipse cx="220" cy="160" rx="149" ry="26"/>
      <ellipse cx="220" cy="280" rx="149" ry="26"/>
      <ellipse cx="220" cy="105" rx="110" ry="18"/>
      <ellipse cx="220" cy="335" rx="110" ry="18"/>
    </g>

    <!-- stylised continents (illustrative, not data) -->
    <g fill="#161D27" stroke="#52627A" stroke-opacity="0.8" stroke-width="0.9" stroke-linejoin="round">
      <path d="M110,140 C122,124 140,118 156,122 C162,132 158,146 150,150 C140,156 128,160 118,158 C110,154 106,148 110,140 Z"/>
      <path d="M150,150 C170,128 205,112 245,105 C285,98 325,108 350,128 C366,142 372,162 368,182 C362,198 345,204 330,210 C318,214 300,212 290,220 C280,226 272,214 262,206 C248,198 228,198 215,205 C200,200 188,196 176,190 C162,183 148,170 150,150 Z"/>
      <path d="M215,205 C228,198 248,198 262,206 C270,214 268,228 262,240 C256,256 248,272 238,292 C235,298 230,302 228,296 C222,280 214,262 208,246 C203,238 196,234 196,228 C198,220 206,212 215,205 Z"/>
      <path d="M290,220 C300,222 310,232 312,246 C314,258 306,268 300,262 C296,252 292,240 286,232 Z"/>
      <path d="M150,205 C165,198 182,204 190,214 C194,226 188,240 176,250 C166,258 156,254 150,244 C144,232 142,216 150,205 Z"/>
      <path d="M92,215 C108,205 128,206 142,214 C150,226 148,240 156,252 C164,268 166,288 158,308 C150,330 136,350 120,360 C108,366 100,352 96,336 C92,316 82,296 78,276 C74,256 78,230 92,215 Z"/>
      <path d="M318,340 C334,332 356,334 368,346 C372,356 362,368 348,372 C336,374 322,366 316,356 Z"/>
      <ellipse cx="300" cy="300" rx="14" ry="5" transform="rotate(20 300 300)"/>
      <ellipse cx="326" cy="313" rx="10" ry="4" transform="rotate(10 326 313)"/>
      <ellipse cx="276" cy="314" rx="9" ry="3.5"/>
      <ellipse cx="244" cy="305" rx="3" ry="4"/>
      <ellipse cx="170" cy="330" rx="4" ry="10" transform="rotate(15 170 330)"/>
    </g>

    <!-- lighting -->
    <circle cx="220" cy="220" r="160" fill="url(#igLight)"/>
    <circle cx="220" cy="220" r="160" fill="url(#igNight)"/>
    <circle cx="220" cy="220" r="160" fill="url(#igInnerRim)"/>
  </g>

  <!-- glowing rim -->
  <circle class="ig-rim" cx="220" cy="220" r="160" fill="none" stroke="#FB923C" stroke-width="7" stroke-opacity="0.55" filter="url(#igBlur)"/>
  <circle cx="220" cy="220" r="160" fill="none" stroke="#F97316" stroke-width="1.3" stroke-opacity="0.9"/>
</svg>
